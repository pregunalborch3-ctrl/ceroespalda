<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular teal -->
  <circle cx="16" cy="16" r="16" fill="#0d9488"/>
  <!-- Figura humana de perfil, escalada para caber en el círculo -->
  <g transform="translate(6.8, 1) scale(0.652)">
    <!-- Cabeza -->
    <circle cx="16" cy="5.5" r="5.5" fill="#ffffff"/>
    <!-- Cuello -->
    <rect x="13" y="10.5" width="5.5" height="5" rx="2.75" fill="#ffffff"/>
    <!-- Torso (silueta de perfil con postura correcta) -->
    <path d="M10 15C7 17 6 21 6 25C6 29 7.5 32 8 35C8.5 37 9 39 9.5 40L20 40C20.5 38.5 21 36 21 34C21 30 22 26 22 22C22 18 21 16 19 15Z" fill="#ffffff"/>
    <!-- Columna vertebral — curva S en verde -->
    <path d="M16 15C18.5 19 14 24 15.5 29.5C17 35 16 38 15.5 40" stroke="#10b981" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Puntos de alineación postural (oído-hombro-cadera) -->
    <circle cx="15.5" cy="6" r="1.5" fill="#10b981" opacity="0.85"/>
    <circle cx="15" cy="15.5" r="1.5" fill="#10b981" opacity="0.85"/>
    <circle cx="15.5" cy="39" r="1.5" fill="#10b981" opacity="0.85"/>
  </g>
</svg>
